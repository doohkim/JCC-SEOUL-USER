gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

server {
    listen 80;
    server_name shalom.dev.admin.jcc-seoul.com shalom.dev.api.jcc-seoul.com shalom.dev.docs.jcc-seoul.com shalom.dev.jcc-seoul.com;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shalom.dev.jcc-seoul.com;

    ssl_certificate /etc/letsencrypt/live/shalom.dev.jcc-seoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shalom.dev.jcc-seoul.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/shalom.dev.jcc-seoul.com/chain.pem;

    charset utf-8;
    client_max_body_size 1280M;
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 256;

    location /health-check/ {
        proxy_set_header Host health-check;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://django:8000;
    }

    location / {
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 공유기 8443→443 포워딩: social-auth absolute URI에 :8443 유지
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass_header Server;
        proxy_pass http://django:8000;
        proxy_redirect off;
    }

    location /mq/ {
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://rabbitmq:15672;
    }

    location /media/ {
        alias /srv/.media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /srv/.static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}


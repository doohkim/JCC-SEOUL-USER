{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    {% include 'includes/jcc_theme_head.html' %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>공지 삭제</title>
    <link rel="stylesheet" href="{% static 'attendance/app.css' %}" />
  </head>
  <body>
    <div class="jcc-layout">
      {% include 'includes/jcc_left_nav.html' %}
      <div class="jcc-layout-content">
        <header class="app-header">
          <div class="jcc-detail-titleWrap">
            <h1>공지 삭제</h1>
          </div>
        </header>
        <main>
          <div class="card">
            <p>「{{ object.title }}」 공지를 삭제할까요?</p>
            <form method="post">
              {% csrf_token %}
              <div class="toolbar" style="padding:0; border:none; background:transparent;">
                <button type="submit">삭제</button>
                <a class="secondary" href="{% url 'notice_detail' object.pk %}">취소</a>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>

{% comment %}행사 단위 상단 탭 — event, can_view_retreat_all, is_retreat_staff, available_events, retreat_tab 필요{% endcomment %}
<div class="jcc-retreat-pageTabsRow">
  {% if available_events %}
    <select
      id="retreatEventSwitcher"
      class="jcc-retreat-eventSwitcher"
      aria-label="행사 선택"
    >
      {% for ev in available_events %}
        {% if retreat_tab == 'manage_groups' %}
          {% url 'retreat_group_manage_list' ev.id as ev_url %}
        {% elif retreat_tab == 'lodging' %}
          {% url 'retreat_lodging' ev.id as ev_url %}
        {% elif retreat_tab == 'lodging_assign' %}
          {% url 'retreat_lodging_assign' ev.id as ev_url %}
        {% elif retreat_tab == 'admin' %}
          {% url 'retreat_admin' ev.id as ev_url %}
        {% elif retreat_tab == 'council' %}
          {% url 'retreat_council' ev.id as ev_url %}
        {% elif retreat_tab == 'timetable' %}
          {% url 'retreat_timetable' ev.id as ev_url %}
        {% elif retreat_tab == 'pickup' %}
          {% url 'retreat_pickup' ev.id as ev_url %}
        {% elif retreat_tab == 'results' %}
          {% url 'retreat_results' ev.id as ev_url %}
        {% elif retreat_tab == 'rosters' %}
          {% url 'retreat_rosters' ev.id as ev_url %}
        {% else %}
          {% url 'retreat_dashboard' ev.id as ev_url %}
        {% endif %}
        <option value="{{ ev_url }}"{% if ev.id == event.id %} selected{% endif %}>{{ ev.name }}</option>
      {% endfor %}
    </select>
  {% endif %}
  <nav class="jcc-page-tabs jcc-retreat-pageTabs" aria-label="수련회 메뉴">
    <a
      class="jcc-page-tab{% if retreat_tab == 'dashboard' %} is-active{% endif %}"
      href="{% url 'retreat_dashboard' event.id %}"
    >대시보드</a>
    <a
      class="jcc-page-tab{% if retreat_tab == 'manage_groups' %} is-active{% endif %}"
      href="{% url 'retreat_group_manage_list' event.id %}"
    >조 관리</a>
    <a
      class="jcc-page-tab{% if retreat_tab == 'pickup' %} is-active{% endif %}"
      href="{% url 'retreat_pickup' event.id %}"
    >픽업</a>
    {% if can_view_retreat_all %}
      <a
        class="jcc-page-tab{% if retreat_tab == 'lodging' or retreat_tab == 'lodging_assign' %} is-active{% endif %}"
        href="{% url 'retreat_lodging' event.id %}"
      >숙소</a>
    {% endif %}
    {% if is_retreat_staff %}
      <a
        class="jcc-page-tab{% if retreat_tab == 'admin' or retreat_tab == 'council' or retreat_tab == 'timetable' %} is-active{% endif %}"
        href="{% url 'retreat_admin' event.id %}"
      >관리</a>
    {% endif %}
  </nav>
</div>
<script>
  (function () {
    var sw = document.getElementById("retreatEventSwitcher");
    if (!sw) return;
    sw.addEventListener("change", function () {
      var v = sw.value;
      if (v) window.location.href = v;
    });
  })();
</script>

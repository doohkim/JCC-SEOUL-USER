{% comment %}숙소 탭 서브탭 — event, lodging_subtab ('manage' | 'roster'){% endcomment %}
<nav class="jcc-page-tabs jcc-retreat-lodgingSubTabs" aria-label="숙소 관리 서브탭">
  <a
    class="jcc-page-tab{% if lodging_subtab == 'manage' %} is-active{% endif %}"
    href="{% url 'retreat_lodging' event.id %}"
  >숙소·호수 관리</a>
  <a
    class="jcc-page-tab{% if lodging_subtab == 'roster' %} is-active{% endif %}"
    href="{% url 'retreat_lodging_roster' event.id %}"
  >전체 명단</a>
</nav>

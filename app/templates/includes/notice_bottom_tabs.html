{% comment %}함께하기 모바일 하단 탭 — notices_tab('notices'|'timetable') 로 활성 표시{% endcomment %}
<nav class="jcc-bottomTabs jcc-noticeBottomTabs" id="jccNoticeBottomTabs" aria-label="함께하기 메뉴">
  <a
    class="jcc-bottomTab{% if notices_tab == 'notices' %} is-active{% endif %}"
    href="{% url 'notice_list' %}"
    {% if notices_tab == 'notices' %}aria-current="page"{% endif %}
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
    </svg>
    <span>이야기</span>
  </a>
  <a
    class="jcc-bottomTab{% if notices_tab == 'timetable' %} is-active{% endif %}"
    href="{% url 'timetable' %}"
    {% if notices_tab == 'timetable' %}aria-current="page"{% endif %}
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
      <rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.75"/>
      <path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    </svg>
    <span>타임테이블</span>
  </a>
</nav>

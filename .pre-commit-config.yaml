repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: .*docker-compose.*?ya?ml
      - id: end-of-file-fixer
        files: .*\.py|requirements\.txt|pyproject\.toml
      - id: trailing-whitespace
        files: .*\.py|requirements\.txt|pyproject\.toml

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: .*\.py

  - repo: local
    hooks:
      - id: poetry-export-requirements
        name: Poetry export requirements.txt
        language: system
        entry: bash -c 'poetry export -f requirements.txt --without-hashes -o requirements.txt && git add requirements.txt'
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
